name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a branch makes the run already in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test, lint, and the target that ships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action: rust-toolchain.toml pins the channel, the
      # components and the wasm target, and rustup honours it on the first
      # cargo invocation. CI and a laptop therefore run the same compiler.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The pure logic — diff model, markdown, tree, search, symbols, parsing.
      # Runs on the host: the gloo/web-sys crates compile there even though
      # their calls only work in a page.
      - name: Tests
        run: cargo test

      # What actually ships. `cargo test` above never builds this, so without
      # it a wasm-only breakage lands green.
      - name: Check wasm32-unknown-unknown
        run: cargo check --target wasm32-unknown-unknown

      # The browser extension's half of the `?url=` handoff. No dependencies
      # and no browser — `extension/handoff.js` touches no `chrome.*` API for
      # exactly this reason, and the escaping it produces is pinned on the Rust
      # side by `what_a_browser_escapes_is_what_this_reads_back`. Break either
      # end and one of the two suites says so.
      - name: Extension
        working-directory: extension
        run: node --test test.js
