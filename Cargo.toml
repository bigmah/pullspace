[package]
name = "pullspace"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
anyrender = "0.11"
anyrender_vello_cpu = "0.14"
blitz-dom = "=0.3.0-beta.1"
blitz-html = "=0.3.0-beta.1"
blitz-paint = "=0.3.0-beta.1"
blitz-traits = "=0.3.0-beta.1"
dioxus = { version = "0.6", features = ["desktop"] }
dirs = "6.0.0"
git2 = "0.21.0"
ignore = "0.4.33"
open = "5.4.1"
png = "0.17"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = { version = "3.1.2", features = ["inline", "unicode"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tokio = { version = "1.53.1", features = ["rt", "time"] }
ureq = { version = "3.4.0", features = ["json"] }
