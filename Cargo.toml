[package]
name = "pullspace"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dioxus = { version = "0.6", features = ["desktop"] }
git2 = "0.21.0"
ignore = "0.4.33"
regex = "1.13.1"
rfd = "0.17.2"
similar = { version = "3.1.2", features = ["inline", "unicode"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tokio = { version = "1.53.1", features = ["rt"] }
