[package]
name = "pullspace"
version = "0.1.0"
edition = "2024"
description = "An IDE-style GitHub pull request reviewer that is a static page — no server, no backend, and your code never leaves the browser."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bigmah/pullspace"
readme = "README.md"
keywords = ["github", "pull-request", "code-review", "diff", "wasm"]
categories = ["development-tools", "wasm", "web-programming"]
# Let-chains (`if x && let Some(y) = z`), which this leans on throughout, are
# stable from 1.88 in edition 2024.
rust-version = "1.88"

# One build, one target:
#   dx build --platform web --release   → a static page: an index.html, a .wasm
#                                         and a .js, and nothing else.
#
# pullspace reviews pull requests on GitHub. It reads them over the REST API,
# from the browser tab it is open in — api.github.com answers cross-origin
# requests, so there is no server on either side of that. Nothing here touches
# a machine: no git, no filesystem, no native code.
#
# `cargo test` still runs natively. The gloo/web-sys crates compile for the host
# even though their calls only work in a browser, and everything with tests —
# diffing, highlighting, markdown, the tree model, URL parsing — is pure.

[dependencies]
anyhow = "1.0.104"
dioxus = { version = "0.6", features = ["web"] }
futures-util = { version = "0.3", default-features = false }
# The browser's fetch, its timers, and its local storage.
gloo-net = { version = "0.7", default-features = false, features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Window/Storage is localStorage — the token, the pane sizes and what has been
# marked read. Location is the address bar, which is where the pull request on
# screen is written so it can be linked to: see `backend::route`. Everything
# from Navigator down is the Origin Private File System, which is where the
# repository itself is kept: see `backend::opfs`.
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Location",
    # `replaceState`, so that reading four files of one pull request is one
    # entry in the browser's history rather than four — see `backend::route`.
    "History",
    # `navigator.clipboard`, which is how the link to a line gets somewhere it
    # can be pasted.
    "Clipboard",
    # `document.documentElement`, which is the element handed to the browser
    # when the app asks for the screen — see `backend::screen`.
    "Document",
    "Element",
    "Navigator",
    "StorageManager",
    "Blob",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
] }
pulldown-cmark = { version = "0.13.4", default-features = false }
# Search, and the definition patterns the symbol index is built out of. Nearly
# free in the bundle: syntect's fancy-regex already compiles regex-automata and
# regex-syntax in, and this crate is mostly a front door onto those two.
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `wasm32_web_time` is not optional here, whatever its name suggests. The
# word-level emphasis in `inline` gives its own diff a 500ms deadline, and it
# reads the clock to do it — which on wasm32-unknown-unknown is
# `std::time::Instant::now()`, and panics. A panic in a browser is not an error
# anyone can catch: the app stops, mid-render, and the tab has to be reloaded.
# The feature swaps in `web_time::Instant`, which is `performance.now()` in a
# page and plain std everywhere else.
similar = { version = "3.1.2", features = ["inline", "unicode", "wasm32_web_time"] }
# default-fancy is the pure-Rust build (fancy-regex, no onig C code), which is
# what lets the highlighter run inside the wasm bundle.
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
# std::time::Instant panics on wasm32-unknown-unknown.
web-time = "1"

# `wasm-dev` is what `dx build --platform web` uses for a debug build.
#
# The two below it are dead here — there is no server and no android build —
# but they are not removable: the dioxus CLI writes all three back into this
# file on every `dx build`. Deleting them is undone by the next one, so they
# stay, labelled, rather than reappearing unexplained.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
