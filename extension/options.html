<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open in pullspace</title>
    <style>
      /* pullspace's own colours, near enough that the two do not look like
         different products. Both themes, because an options panel opens inside
         whatever Chrome is set to. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1c1e26;
        --dim: #5c6070;
        --line: #d8dae1;
        --field: #ffffff;
        --accent: #2f6fd0;
        --bad: #c4384a;
        --good: #2f7d4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181d;
          --fg: #e3e5ec;
          --dim: #848a9c;
          --line: #2c2e37;
          --field: #1e2027;
          --accent: #5c9cf5;
          --bad: #e06c75;
          --good: #4fbf7a;
        }
      }
      body {
        margin: 0;
        padding: 18px 20px 20px;
        width: 380px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 600;
      }
      p.sub {
        margin: 0 0 16px;
        color: var(--dim);
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input[type="text"] {
        box-sizing: border-box;
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--field);
        color: var(--fg);
        font: inherit;
      }
      input[type="text"]:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: transparent;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }
      .row label {
        margin: 0;
        font-weight: 400;
      }
      .preview {
        margin-top: 10px;
        padding: 8px 9px;
        border-radius: 6px;
        background: var(--field);
        border: 1px solid var(--line);
        color: var(--dim);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.45;
        word-break: break-all;
      }
      .preview.bad {
        color: var(--bad);
      }
      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
      }
      button {
        padding: 6px 14px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #said {
        color: var(--good);
      }
      #said.bad {
        color: var(--bad);
      }
      .note {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--dim);
      }
      .note a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>Open in pullspace</h1>
    <p class="sub">Where your copy of pullspace is served from.</p>

    <label for="base">Address</label>
    <input
      id="base"
      type="text"
      spellcheck="false"
      autocapitalize="off"
      autocomplete="off"
      placeholder="https://pullspace.example.com/"
    />

    <div class="preview" id="preview"></div>

    <div class="row">
      <input id="newTab" type="checkbox" />
      <label for="newTab">Open in a new tab</label>
    </div>

    <footer>
      <button id="save" type="button">Save</button>
      <span id="said"></span>
    </footer>

    <p class="note">
      The button hands the GitHub page you are on to that address in a
      <code>?url=</code> field, and pullspace opens what it names. Any static
      host will do — a server of your own, or <code>localhost:8123</code> while
      you are working on it.
    </p>

    <script type="module" src="options.js"></script>
  </body>
</html>
